<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FGM Prevalent countries</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"/>
      <link rel="stylesheet" href="style.css" />

    <!-- Leaflet JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"></script>
    <script src="FGM_prevelance.js"></script>
</head>
<body>
    <div id="map"></div>

    <div id="dashboard">

        <h2>FGM Prevalence</h2>

        <div id="country-info">
            <p>Click on a country to display its information.</p>
        </div>

        <div id="legend">
            <h3>Legend</h3>

            <p><span class="low"></span> Low</p>
            <p><span class="medium"></span> Medium</p>
            <p><span class="high"></span> High</p>
        </div>

    </div>

<!--Script files goes at the bottom of the body section-->
<script>
    // Create the map
      var map = L.map('map', {
      center: [13.36, 20.90],
      zoom: 3,
      maxBounds: [[-28.61, -45.84], [48.50, 144.74]],
      });

    // OpenStreetMap basemap
      var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
      });

      osm.addTo(map);

    // Thunderforest Neighbourhood basemap
        var Thunderforest_Neighbourhood = L.tileLayer('https://api.thunderforest.com/neighbourhood/{z}/{x}/{y}{r}.png?apikey={apikey}', {
            attribution: '&copy; <a href="http://www.thunderforest.com/">Thunderforest</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            apikey: '580d7760e4c9433fa158fa9d21b3f3be',
            maxZoom: 22
        });

        Thunderforest_Neighbourhood.addTo(map);

    // ESRI World Gray basemap
    var Esri_WorldGrayCanvas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxZoom: 16
    });

    Esri_WorldGrayCanvas.addTo(map);

    // Adding FGM prevelance map
      var FGM_prevelance = L.geoJson(FGM_prevelance);

      FGM_prevelance.addTo(map);

    // Create a function to define colours
        function getColor(prevelance) {
        switch (prevelance) {
            case 'low':
                return '#ffffb2';

            case 'medium':
                return '#ffb870';

            case 'high':
                return '#e31a1c';

            default:
                return '#cccccc';
            }
        }

    // Adding style function to accesses the Prevelance property and the appropriate fill colour
        function style(feature) {
        return {
            fillColor: getColor(feature.properties.Prevelance),
            weight: 1,
            opacity: 1,
            color: '#666666',
            fillOpacity: 0.80
            };
        }

    // Apply the style to the FGM_prevelance layer
        FGM_prevelance.setStyle(style);

    // Create a function to update the dashboard with country information
    function updateDashboard(properties) {

    document.getElementById('country-info').innerHTML = `
        <h3>${properties.CNTR_NAME}</h3>

        <p><strong>FGM percentage:</strong>
            ${properties.FGM_percentage}%
        </p>

        <p><strong>Prevalence:</strong>
            ${properties.Prevelance}
        </p>
    `;
    }

    // Toolip and click eevents
    function onEachFeature(feature, layer) {

        // Create tooltip
        layer.bindTooltip(feature.properties.CNTR_NAME, {
            sticky: true,
            direction: 'top'
        });

        // Zoom into individual country on click
        layer.on('click', function(e) {
            map.fitBounds(layer.getBounds());
        });

        // Add event listeners
        layer.on({

            click: function(e) {
                updateDashboard(feature.properties);
            },

            mouseover: function(e) {
                e.target.setStyle({
                    weight: 3,
                    color: '#333333',
                    fillOpacity: 1
                });
            },

            mouseout: function(e) {
                e.target.setStyle({
                    weight: 1,
                    color: '#333333',
                    fillOpacity: 0.80
                });

            // Reset dashboard content on mouseout
            document.getElementById('country-info').innerHTML =
                '<p>Click on a country to display its information.</p>';
            }

        });
    }

    // Apply the onEachFeature function to the FGM_prevelance layer
          FGM_prevelance.eachLayer(function(layer) {
          onEachFeature(layer.feature, layer);
          });

    // Zoom to the extent of the GeoJSON layer
          map.fitBounds(FGM_prevelance.getBounds());

    // Basemaps control
        var basemaps = {
        "OSM": osm,
        "Thunderforest Neighbourhood": Thunderforest_Neighbourhood,
        "Esri World Gray Canvas": Esri_WorldGrayCanvas
        };
        
    // Create overlay maps object
        L.control.layers(basemaps).addTo(map);

</script>
</body>
</html>
